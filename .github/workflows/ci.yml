name: Cross-platform plugin test

on:
  push:
  pull_request:

jobs:
  test-and-install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/agent-teams-builder/package-lock.json
      - uses: actions/setup-go@v6
        if: runner.os == 'Windows'
        with:
          go-version: stable
      - name: Install plugin runtime dependencies
        run: npm ci --prefix plugins/agent-teams-builder --no-audit --no-fund
      - name: Run automated tests
        run: npm test
      - name: Install real host CLIs
        run: npm install --global @openai/codex @anthropic-ai/claude-code
      - name: Validate Claude Code manifest
        run: claude plugin validate plugins/agent-teams-builder --strict --json
      - name: Run one-click installer on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export AGENT_TEAMS_INSTALL_ROOT="$RUNNER_TEMP/Agent Teams"
          export AGENT_TEAMS_SKIP_LOGIN="1"
          export AGENT_TEAMS_SKIP_UPDATE="1"
          export AGENT_TEAMS_SKIP_EMBED="1"
          ./install.command
          codex plugin list | grep 'agent-teams-builder@agent-teams-local'
          claude plugin list | grep 'agent-teams-builder@agent-teams-local'
          AGENT_TEAMS_HOME="$AGENT_TEAMS_INSTALL_ROOT" VIXO_AGENTS_PORT=47829 node "$AGENT_TEAMS_INSTALL_ROOT/.system/marketplace/plugins/agent-teams-builder/scripts/vixo-agents-dashboard.mjs" start
          AGENT_TEAMS_HOME="$AGENT_TEAMS_INSTALL_ROOT" VIXO_AGENTS_PORT=47829 node "$AGENT_TEAMS_INSTALL_ROOT/.system/marketplace/plugins/agent-teams-builder/scripts/vixo-agents-dashboard.mjs" status | grep '"running": true'
          AGENT_TEAMS_HOME="$AGENT_TEAMS_INSTALL_ROOT" VIXO_AGENTS_PORT=47829 node "$AGENT_TEAMS_INSTALL_ROOT/.system/marketplace/plugins/agent-teams-builder/scripts/vixo-agents-dashboard.mjs" stop
      - name: Run one-click installer on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:AGENT_TEAMS_INSTALL_ROOT = Join-Path $env:RUNNER_TEMP "Agent Teams"
          $env:AGENT_TEAMS_SKIP_LOGIN = "1"
          $env:AGENT_TEAMS_SKIP_UPDATE = "1"
          $env:AGENT_TEAMS_SKIP_EMBED = "1"
          $env:VIXO_INSTALL_NONINTERACTIVE = "1"
          $nodeDirectory = Split-Path (Get-Command node).Source
          New-Item -ItemType Directory -Force .\runtime\windows-x64\node_modules | Out-Null
          Copy-Item (Join-Path $nodeDirectory "node.exe") .\runtime\windows-x64\node.exe
          Copy-Item (Join-Path $nodeDirectory "node_modules\npm") .\runtime\windows-x64\node_modules\npm -Recurse
          go build -trimpath -ldflags "-s -w" -o .\Install-Agent-Builder.test.exe .\launchers\windows-installer\main.go
          & .\Install-Agent-Builder.test.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows EXE installer failed with exit code $LASTEXITCODE" }
          powershell -ExecutionPolicy Bypass -File .\Install-Agent-Builder.ps1
          codex plugin list | Select-String 'agent-teams-builder@agent-teams-local'
          claude plugin list | Select-String 'agent-teams-builder@agent-teams-local'
          $dashboard = Join-Path $env:AGENT_TEAMS_INSTALL_ROOT ".system\marketplace\plugins\agent-teams-builder\scripts\vixo-agents-dashboard.mjs"
          $env:AGENT_TEAMS_HOME = $env:AGENT_TEAMS_INSTALL_ROOT
          $env:VIXO_AGENTS_PORT = "47829"
          & node $dashboard start
          $dashboardStatus = & node $dashboard status
          if (($dashboardStatus -join "`n") -notmatch '"running": true') { throw "VIXO Agents Dashboard did not start" }
          & node $dashboard stop
