<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIXO 雲端連線</title><link rel="stylesheet" href="/styles.css"><style>body{max-width:1000px;margin:auto;padding:32px}section{background:white;padding:24px;border:1px solid #ddd;border-radius:16px;margin:20px 0}label{display:block;margin:12px 0}input,select{width:100%;padding:10px}button{margin:8px 8px 8px 0;padding:10px 16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:440px;overflow:auto}#notice{white-space:pre-wrap}li{margin:12px 0}.actions{display:flex;gap:12px;flex-wrap:wrap}</style></head><body>
<header><h1>VIXO 雲端連線</h1><p>Agent、Skill、Workflow 從雲端同步，使用目前的 Codex／Claude 執行。</p><a href="/" id="back">返回 VIXO</a></header>
<p id="notice" role="status"></p>
<section id="connect"><h2>連接這台裝置</h2><p>從已連線的裝置取得換機碼，或向團隊管理員取得邀請碼。不需要另外註冊帳號。</p><form id="pair"><label>一次性裝置連線碼或團隊邀請碼<input id="pair-code" type="password" autocomplete="off" required></label><button class="primary">連接雲端</button></form></section>
<section id="account" hidden><h2>雲端已連線</h2><p id="identity"></p><div class="actions"><button id="device-code">連接另一台自己的裝置</button><button id="portal">開啟雲端管理中心</button><button id="disconnect">中斷此裝置連線</button></div><p id="device-result"></p></section>
<section id="publish-section" hidden><h2>把本地訓練成果上傳</h2><p>先檢視完整內容，再確認發布。個人記憶與執行紀錄不會包含在共用套件。</p><form id="preview"><label>本地 Agent<select id="local-agent" required></select></label><label>發布內容<select id="kind"><option value="agent">完整 Agent</option><option value="skill">單一 Skill</option><option value="workflow">單一 Workflow（含所需 Skill）</option></select></label><label id="resource-label" hidden>Skill／Workflow<select id="resource"></select></label><label>發布到<select id="workspace"><option value="">我的個人空間</option></select></label><button>預覽完整內容</button></form><div id="draft" hidden><pre id="draft-content"></pre><button id="confirm" class="primary">已檢視，確認發布到雲端</button></div></section>
<section id="assets-section" hidden><h2>雲端內容</h2><p>回到 VIXO 即可看到雲端 Agent；獨立 Skill 與 Workflow 可在 Codex 使用 cloud_prepare_run。</p><button id="reload">重新同步清單</button><ul id="assets"></ul><pre id="asset-detail"></pre></section>
<script type="module" src="/cloud-panel.mjs"></script></body></html>
