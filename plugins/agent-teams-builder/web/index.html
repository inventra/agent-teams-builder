<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VIXO Agents</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .status.failed,.status.rejected{color:#b44136}.status.waiting-input{color:#6a56a3}
    .run-side{display:flex;min-width:180px;flex-direction:column;align-items:flex-end;gap:9px}
    .run-actions{display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap}.run-actions button{padding:7px 10px}
    .run-message{white-space:pre-wrap;margin-top:7px;max-width:820px}.legacy-note{color:var(--muted);font-size:11px}
    .form-note{font-size:11px;margin:-6px 0 16px}
    .header-actions{display:flex;gap:8px;flex-wrap:wrap}.update-banner{display:flex;align-items:center;justify-content:space-between;gap:24px;margin:-8px 0 28px;padding:18px 20px;border:1px solid #bed6c2;border-radius:16px;background:#edf8ef;box-shadow:0 10px 32px rgba(45,103,79,.08)}.update-banner[hidden]{display:none}.update-banner strong{font-size:15px}.update-banner p{margin-top:4px;font-size:12px}.update-banner.failed{border-color:#e7b8b2;background:#fff1ef}.update-banner.success{border-color:#b8d8bd;background:#eff9f1}.update-banner.running{border-color:#cad2e4;background:#f2f5fb}.update-pill{display:inline-flex;margin-right:9px;padding:4px 7px;border-radius:99px;background:var(--green);color:#fff;font-size:9px;font-weight:800;letter-spacing:.12em}.banner-close{border:0;background:transparent;color:var(--muted);font-size:24px;cursor:pointer}.update-spinner{width:22px;height:22px;flex:none;border:3px solid #d7ded9;border-top-color:var(--green);border-radius:50%;animation:update-spin .8s linear infinite}@keyframes update-spin{to{transform:rotate(360deg)}}
    @media(max-width:850px){.run{display:block}.run-side{align-items:flex-start;margin-top:10px}}
    @media(max-width:850px){.header-actions{margin-top:16px}.header-actions button{margin-top:0}.update-banner{align-items:flex-start}.update-banner .primary{flex:none}}
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand"><span class="brand-mark">V</span><div><strong>VIXO Agents</strong><small>Agent Team Console</small></div></div>
      <nav id="agent-nav"></nav>
      <div class="aside-foot"><span class="dot"></span><span id="host-status">正在連線…</span></div>
    </aside>
    <main>
      <header>
        <div><div class="eyebrow">VIXO AGENT TEAM</div><h1 id="page-title">員工總覽</h1><p id="page-subtitle">把訓練結果、技能與執行流程放在同一個畫面。</p></div>
        <div class="header-actions"><button id="check-update" class="secondary">檢查更新</button><button id="refresh" class="secondary">重新整理</button></div>
      </header>
      <section id="update-banner" class="update-banner" hidden></section>
      <section id="summary" class="summary"></section>
      <section id="content"></section>
    </main>
  </div>
  <dialog id="run-dialog">
    <form id="run-form" method="dialog">
      <button class="dialog-close" value="cancel" aria-label="關閉">×</button>
      <div class="eyebrow">RUN WORKFLOW</div><h2>執行 Workflow</h2>
      <input type="hidden" name="agent"><input type="hidden" name="workflow">
      <label>執行宿主<select name="host"><option value="codex">Codex</option><option value="claude">Claude Code</option></select></label>
      <label id="execution-mode-field">執行位置<select name="executionMode"><option value="codex-app">在 Codex 左側建立新任務</option><option value="background">背景 CLI 執行</option></select></label>
      <label id="codex-project-field">Codex 專案<select name="projectId"></select></label>
      <p id="codex-project-note" class="form-note">按下 Play 後會切換到所選專案、建立新的 Codex Session，並立即執行 Workflow。</p>
      <label>任務說明<textarea name="task" rows="4" required>執行這個 Workflow</textarea></label>
      <label>核准模式<select name="approvalMode"><option value="manual">遇到核准節點時暫停（建議）</option><option value="auto">本次自動核准 Workflow 節點</option></select></label>
      <p class="form-note">自動核准只套用於這個 Workflow 內建的確認節點，不會繞過 Codex／Claude Code 的工具權限與安全規則。</p>
      <button class="primary" value="default">開始執行</button>
    </form>
  </dialog>
  <dialog id="schedule-dialog">
    <form id="schedule-form" method="dialog">
      <button class="dialog-close" value="cancel" aria-label="關閉">×</button>
      <div class="eyebrow">AUTOMATION</div><h2>設定每日排程</h2>
      <input type="hidden" name="agentId"><input type="hidden" name="workflowId">
      <label>執行時間<input name="time" type="time" value="08:00" required></label>
      <label>執行宿主<select name="host"><option value="codex">Codex</option><option value="claude">Claude Code</option></select></label>
      <label>任務說明<textarea name="task" rows="3">依排程執行這個 Workflow</textarea></label>
      <label>核准模式<select name="approvalMode"><option value="manual">遇到核准節點時暫停</option><option value="auto">排程執行時自動核准 Workflow 節點</option></select></label>
      <p class="form-note">排程若需要無人值守執行，可選擇自動核准；宿主安全權限仍會保留。</p>
      <button class="primary" value="default">儲存排程</button>
    </form>
  </dialog>
  <div id="toast" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
