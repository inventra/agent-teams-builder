name: Deploy VIXO Cloud
on:
  push:
    branches: [main]
    paths: ['cloud/**', 'plugins/agent-teams-builder/web/cloud-*', 'scripts/build-cloud.mjs', '.github/workflows/cloud-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vixo-cloud-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/cloud-ui.test.mjs plugins/agent-teams-builder/tests/cloud-client.test.mjs
      - run: node scripts/build-cloud.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/cloud
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
